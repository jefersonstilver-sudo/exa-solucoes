    <!-- Hard cache bust -->
    <script>
      (function() {
        var BUILD_ID = '__BUILD_ID__';
        var key = 'html-build-id';
        // mantém ?parâmetros e #hash do endereço (links de senha, propostas, UTM)
        function comCb() { var q = location.search || ''; return location.pathname + q + (q ? '&' : '?') + '_cb=' + Date.now() + (location.hash || ''); }
        var stored = localStorage.getItem(key);
        // Páginas de link único (criar/redefinir senha, confirmação, 2FA) NUNCA recarregam sozinhas:
        // o recarregamento perdia o ?th=… / #access_token=… do link e o cliente via "link inválido".
        var semRecarga = /^\/(definir-senha|reset-password|redefinir-senha|esqueci-senha|confirmacao|verificacao-2fa|email-not-confirmed|auth)/i.test(location.pathname);
        if (semRecarga) { localStorage.setItem(key, BUILD_ID); }
        else if (stored && stored !== BUILD_ID) {
          localStorage.setItem(key, BUILD_ID);
          if ('caches' in window) {
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).then(function() {
              window.location.replace(comCb());
            });
          } else {
            window.location.replace(comCb());
          }
          return;
        }
        if (!stored) {
          localStorage.setItem(key, BUILD_ID);
        }
      })();
    </script>

    <!-- Multi-layer version check (Safari macOS, Comet/Chromium desktop, Safari iOS, Chrome, Firefox) -->
    <script>
      (function() {
        var BUILD_ID = '__BUILD_ID__';
        var VERSION_URL = 'https://aakenoljsycyrcrchgxj.supabase.co/functions/v1/get-app-version';
        var MIN_RECHECK_MS = 60 * 1000;       // 60s — respeita política de polling
        var VISIBILITY_RECHECK_MS = 5 * 60 * 1000; // 5min — re-checa quando aba volta a ficar visível

        function clearAndReload() {
          try { localStorage.removeItem('html-build-id'); } catch (e) {}
          try { localStorage.removeItem('app-version'); } catch (e) {}
          var doReload = function() {
            var search = location.search || '';
            var sep = search ? '&' : '?';
            location.replace(location.pathname + search + sep + '_v=' + Date.now() + (location.hash || ''));
          };
          if ('caches' in window) {
            caches.keys()
              .then(function(names) { return Promise.all(names.map(function(n) { return caches.delete(n); })); })
              .then(doReload, doReload);
          } else {
            doReload();
          }
        }

        function checkVersion() {
          if (/^\/(definir-senha|reset-password|redefinir-senha|esqueci-senha|confirmacao|verificacao-2fa|email-not-confirmed|auth)/i.test(location.pathname)) return;
          try {
            var lastTs = parseInt(localStorage.getItem('last-version-check-ts') || '0', 10);
            if (Date.now() - lastTs < MIN_RECHECK_MS) return;
            localStorage.setItem('last-version-check-ts', String(Date.now()));
          } catch (e) {}

          var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
          var timeoutId = ctrl ? setTimeout(function() { ctrl.abort(); }, 4000) : null;

          fetch(VERSION_URL, {
            cache: 'no-store',
            headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' },
            signal: ctrl ? ctrl.signal : undefined
          })
            .then(function(r) { if (timeoutId) clearTimeout(timeoutId); return r.json(); })
            .then(function(d) {
              if (d && d.version && d.version !== '0' && d.version !== BUILD_ID) {
                clearAndReload();
              }
            })
            .catch(function() { /* timeout/erro de rede: tenta de novo na próxima janela */ });
        }

        // Camada 1: boot
        checkVersion();

        // Camada 2: bfcache do Safari (back/forward) — bundle restaurado da memória
        window.addEventListener('pageshow', function(e) {
          if (e.persisted) {
            try { localStorage.setItem('last-version-check-ts', '0'); } catch (err) {}
            checkVersion();
          }
        });

        // Camada 3: aba volta a ficar visível após >5min
        var lastHiddenAt = 0;
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'hidden') {
            lastHiddenAt = Date.now();
          } else if (document.visibilityState === 'visible') {
            if (lastHiddenAt && (Date.now() - lastHiddenAt) > VISIBILITY_RECHECK_MS) {
              try { localStorage.setItem('last-version-check-ts', '0'); } catch (err) {}
              checkVersion();
            }
          }
        });

        // Camada 4: hard-refresh manual via ?force=1 (suporte instrui usuário)
        try {
          if (location.search.indexOf('force=1') !== -1) {
            clearAndReload();
          }
        } catch (e) {}

        // Expõe helper global para suporte
        window.__exaForceRefresh = clearAndReload;
      })();
    </script>
