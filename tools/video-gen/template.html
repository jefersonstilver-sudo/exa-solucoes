<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
/* EXA Motion Studio - gerador de motion graphics (canvas 2D deterministico).
   render(t) desenha o quadro no instante t (segundos). Parametros em window.P (injetados pelo renderizador). */
const P = window.P;
const VERT = P.formato === 'vertical_premium_15s';
const W = VERT ? 1080 : 1920, H = VERT ? 1920 : 1080, DUR = VERT ? 15 : 10;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const U = Math.min(W, H) / 1080;               // unidade de escala
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eoc = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eob = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const S = DUR / 10;                              // escala de tempo das cenas

/* ---------- paleta ---------- */
function hsl(h, s, l, a = 1) { return `hsla(${((h % 360) + 360) % 360},${s}%,${l}%,${a})`; }
const hue = P.hue ?? (() => { let h = 0; for (const c of P.empresa) h = (h * 31 + c.charCodeAt(0)) % 360; return h; })();
const C = {
  bg0: hsl(hue, 45, 6), bg1: hsl(hue + 18, 55, 12), a: hsl(hue, 92, 58), b: hsl(hue + 38, 95, 62), c: hsl(hue - 40, 85, 55),
  text: '#F7F2EA', mute: 'rgba(247,242,234,.62)'
};
const IM = {};
const loadAll = () => Promise.all(Object.entries(P.assets || {}).map(([k, s]) => new Promise(r => { const i = new Image(); i.onload = () => { IM[k] = i; r(); }; i.onerror = r; i.src = s; })));

/* ---------- texto ---------- */
const FONT = (sz, w = 800, it = false) => `${it ? 'italic ' : ''}${w} ${sz}px Inter, Poppins, Arial, sans-serif`;
function setFont(sz, w, ls = 0) { ctx.font = FONT(sz, w); ctx.letterSpacing = ls + 'px'; }
function wid(txt, sz, w, ls) { setFont(sz, w, ls); return ctx.measureText(txt).width; }
function fitSize(txt, maxW, maxSz, w = 900, lsr = -.02) { const m = wid(txt, 100, w, 100 * lsr); return Math.min(maxSz, 100 * maxW / m); }
/* quebra em linhas pelo maximo de largura */
function wrap(txt, sz, w, maxW, lsr) {
  const words = txt.split(' '); const lines = []; let cur = '';
  for (const wd of words) { const t = cur ? cur + ' ' + wd : wd; if (wid(t, sz, w, sz * lsr) > maxW && cur) { lines.push(cur); cur = wd; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
/* palavra a palavra: sobe de uma mascara, com leve blur de movimento e brilho */
function kinetic(txt, cx, cy, sz, t, t0, o = {}) {
  const w = o.w || 900, lsr = o.lsr ?? -.03, maxW = o.maxW || W * .86, lh = o.lh || 1.04, stag = o.stag ?? .11, out = o.out;
  const lines = wrap(txt, sz, w, maxW, lsr); const total = lines.length * sz * lh;
  let wi = 0;
  lines.forEach((ln, li) => {
    const ws = ln.split(' '); const space = wid(' ', sz, w, sz * lsr);
    const ww = ws.map(x => wid(x, sz, w, sz * lsr)); const lw = ww.reduce((a, b) => a + b, 0) + space * (ws.length - 1);
    let x = (o.left !== undefined ? o.left : cx - lw / 2); const y = cy - total / 2 + li * sz * lh + sz * .82;
    ws.forEach((wd, i) => {
      const p0 = prog(t, t0 + wi * stag, t0 + wi * stag + .75); const q = eo(p0);
      let a = clamp(p0 * 4); if (out) a *= 1 - eio(prog(t, out, out + .5));
      if (a > 0) {
        ctx.save(); ctx.beginPath(); ctx.rect(x - sz * .2, y - sz * 1.02, ww[i] + sz * .4, sz * 1.3); ctx.clip();
        setFont(sz, w, sz * lsr); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.globalAlpha = a;
        const yy = y + (1 - q) * sz * 1.15;
        const hot = o.accentWords && o.accentWords.includes(wi);
        if (hot) { const g = ctx.createLinearGradient(x, 0, x + ww[i], 0); g.addColorStop(0, C.a); g.addColorStop(1, C.b); ctx.fillStyle = g; ctx.shadowColor = C.a; ctx.shadowBlur = 40 * U * (1 - p0 * .6); }
        else ctx.fillStyle = o.color || C.text;
        if (o.blur && p0 < 1) { const ba = ctx.globalAlpha; for (let k = 1; k <= 4; k++) { ctx.globalAlpha = ba * .16 / k * 2; ctx.fillText(wd, x, yy + (1 - q) * sz * .16 * k); } ctx.globalAlpha = ba; }
        ctx.fillText(wd, x, yy); ctx.restore();
      }
      x += ww[i] + space; wi++;
    });
  });
  return { h: total };
}

/* ---------- fundo vivo: gradiente + blobs + particulas + grade em perspectiva ---------- */
function bg(t) {
  const g = ctx.createLinearGradient(0, 0, W * .6, H); g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg0); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // metaballs luminosos
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const blobs = [[C.a, .22, .30, 560, 0], [C.b, .78, .70, 680, 1.7], [C.c, .55, .15, 500, 3.1], [C.b, .12, .85, 420, 4.4]];
  for (const [col, bx, by, r, ph] of blobs) {
    const x = W * bx + Math.cos(t * .5 + ph) * W * .09, y = H * by + Math.sin(t * .42 + ph * 1.3) * H * .08, rr = r * U * (1 + .14 * Math.sin(t * .8 + ph));
    const rg = ctx.createRadialGradient(x, y, 0, x, y, rr); rg.addColorStop(0, col.replace(/[\d.]+\)$/, '.38)')); rg.addColorStop(1, col.replace(/[\d.]+\)$/, '0)')); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  // fitas fluidas (ondas senoidais empilhadas, preenchimento em gradiente)
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 4; k++) {
    const base = H * (.25 + k * .17), amp = (70 + k * 28) * U, sp = .5 + k * .18, ph = k * 1.9;
    const gr = ctx.createLinearGradient(0, base - amp, W, base + amp); const col = [C.a, C.b, C.c, C.a][k];
    gr.addColorStop(0, col.replace(/[\d.]+\)$/, '0)')); gr.addColorStop(.5, col.replace(/[\d.]+\)$/, '.13)')); gr.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 24) { const y = base + Math.sin(x / W * 5.2 + t * sp + ph) * amp + Math.sin(x / W * 11 - t * sp * 1.4) * amp * .35; ctx.lineTo(x, y); }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = col.replace(/[\d.]+\)$/, '.35)'); ctx.lineWidth = 2.2 * U; ctx.beginPath();
    for (let x = 0; x <= W; x += 24) { const y = base + Math.sin(x / W * 5.2 + t * sp + ph) * amp + Math.sin(x / W * 11 - t * sp * 1.4) * amp * .35; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
  // raios de luz girando
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(W * .5, H * .42); ctx.rotate(t * .06);
  for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, L = Math.max(W, H) * 1.1; const gr = ctx.createLinearGradient(0, 0, Math.cos(a) * L, Math.sin(a) * L); gr.addColorStop(0, 'rgba(255,255,255,.07)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, L, a, a + .09); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // grade em perspectiva
  ctx.save(); ctx.globalAlpha = .16; ctx.strokeStyle = C.a; ctx.lineWidth = 1.5 * U;
  const hz = H * .6, vx = W / 2; const sp = ((t * .35) % 1);
  for (let i = -14; i <= 14; i++) { ctx.beginPath(); ctx.moveTo(vx + i * 30 * U, hz); ctx.lineTo(vx + i * 330 * U, H); ctx.stroke(); }
  for (let k = 0; k < 14; k++) { const z = (k + sp) / 14; const y = hz + (H - hz) * z * z; ctx.globalAlpha = .16 * z; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // cacos de vidro flutuando (parallax)
  ctx.save();
  for (let i = 0; i < 9; i++) {
    const dep = .4 + rnd(i + 40) * .9, x = ((rnd(i + 50) + t * .012 * dep) % 1) * (W + 300 * U) - 150 * U, y = H * (.1 + rnd(i + 60) * .8) + Math.sin(t * .7 * dep + i) * 30 * U;
    const s = (60 + rnd(i + 70) * 120) * U * dep; ctx.save(); ctx.translate(x, y); ctx.rotate(t * .25 * (i % 2 ? 1 : -1) * dep + i);
    ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.6 * U; ctx.beginPath();
    if (i % 3 === 0) { ctx.moveTo(0, -s); ctx.lineTo(s * .9, s * .7); ctx.lineTo(-s * .9, s * .7); ctx.closePath(); } else ctx.roundRect(-s / 2, -s / 2, s, s, s * .22);
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  // particulas / bokeh
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 130; i++) {
    const sp2 = .02 + rnd(i) * .05; const x = ((rnd(i + 9) + t * sp2 * (VERT ? .6 : 1)) % 1) * W, y = H - (((rnd(i + 3) + t * (.03 + rnd(i + 5) * .06)) % 1) * H);
    const big = i % 11 === 0; const r = (big ? 9 + rnd(i + 7) * 16 : 1 + rnd(i + 7) * 3.2) * U, tw = .35 + .65 * Math.abs(Math.sin(t * 2 + i));
    ctx.fillStyle = (i % 3 ? C.a : C.b).replace(/[\d.]+\)$/, ((big ? .13 : .55) * tw) + ')'); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
/* explosao de particulas com rastro + ondas de choque */
function burst(cx, cy, t, t0, n = 70) {
  const p = prog(t, t0, t0 + 1.6); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = rnd(i + 200) * 6.283, sp = (240 + rnd(i + 210) * 700) * U, d = eoc(p) * sp, x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
    const al = (1 - p) * (.5 + rnd(i + 220) * .5); const tl = (1 - p) * 40 * U * (.5 + rnd(i + 230));
    ctx.strokeStyle = (i % 2 ? C.a : C.b).replace(/[\d.]+\)$/, al + ')'); ctx.lineWidth = (2 + rnd(i + 240) * 4) * U; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(a) * tl, y - Math.sin(a) * tl); ctx.stroke();
  }
  for (let k = 0; k < 3; k++) { const q = prog(t, t0 + k * .18, t0 + k * .18 + 1.1); if (q > 0 && q < 1) { ctx.strokeStyle = [C.a, C.b, C.c][k].replace(/[\d.]+\)$/, (.7 * (1 - q)) + ')'); ctx.lineWidth = (10 - k * 2.5) * U * (1 - q) + 1; ctx.beginPath(); ctx.arc(cx, cy, eoc(q) * (520 + k * 160) * U, 0, 7); ctx.stroke(); } }
  ctx.restore();
}
/* logo do cliente sobre placa de vidro */
function logoCard(cx, cy, maxW, maxH, t, t0) {
  const im = IM.logo; if (!im) return false; const p = eob(prog(t, t0, t0 + .9)); if (p <= 0) return true;
  const sc = Math.min(maxW / im.width, maxH / im.height); const w = im.width * sc, h = im.height * sc, pad = 36 * U;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(p, p); ctx.globalAlpha = clamp(p * 1.6);
  ctx.shadowColor = C.a; ctx.shadowBlur = 70 * U; ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.beginPath(); ctx.roundRect(-w / 2 - pad, -h / 2 - pad, w + pad * 2, h + pad * 2, 34 * U); ctx.fill(); ctx.shadowBlur = 0;
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  const sw = eio(prog(t, t0 + .5, t0 + 1.4)); if (sw > 0 && sw < 1) { ctx.save(); ctx.beginPath(); ctx.roundRect(-w / 2 - pad, -h / 2 - pad, w + pad * 2, h + pad * 2, 34 * U); ctx.clip(); const x = lerp(-w, w, sw); const g = ctx.createLinearGradient(x - 90 * U, 0, x + 90 * U, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.75)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(-w, -h, w * 2, h * 2); ctx.restore(); }
  ctx.restore(); return true;
}
function igChip(cx, cy, sz, t, t0) {
  if (!P.instagram) return; const p = eob(prog(t, t0, t0 + .7)); if (p <= 0) return;
  const txt = '@' + P.instagram.replace(/^@/, ''), tw = wid(txt, sz, 700, sz * .04), iw = sz * 1.5, pw = tw + iw + sz * 1.6, ph = sz * 2.2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(p, p); ctx.globalAlpha = clamp(p * 1.5);
  ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2 * U; ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fill(); ctx.stroke();
  const ix = -pw / 2 + sz * .8 + sz * .6; const gr = ctx.createLinearGradient(ix - sz * .7, sz * .7, ix + sz * .7, -sz * .7); gr.addColorStop(0, '#feda75'); gr.addColorStop(.35, '#fa7e1e'); gr.addColorStop(.65, '#d62976'); gr.addColorStop(1, '#4f5bd5');
  ctx.strokeStyle = gr; ctx.lineWidth = sz * .13; ctx.beginPath(); ctx.roundRect(ix - sz * .62, -sz * .62, sz * 1.24, sz * 1.24, sz * .36); ctx.stroke(); ctx.beginPath(); ctx.arc(ix, 0, sz * .27, 0, 7); ctx.stroke(); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(ix + sz * .4, -sz * .4, sz * .07, 0, 7); ctx.fill();
  ctx.fillStyle = C.text; setFont(sz, 700, sz * .04); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(txt, ix + sz * .95, 2 * U); ctx.restore();
}
/* cartao de vidro com texto */
function glass(cx, cy, w, h, t, t0) {
  const p = eob(prog(t, t0, t0 + .8)); if (p <= 0) return 0; ctx.save(); ctx.translate(cx, cy + (1 - p) * 60 * U); ctx.scale(.9 + .1 * p, .9 + .1 * p); ctx.globalAlpha = clamp(p * 1.4);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 80 * U; ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 40 * U); ctx.fill(); ctx.shadowBlur = 0;
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(.4, 'rgba(255,255,255,.08)'); g.addColorStop(1, C.a.replace(/[\d.]+\)$/, '.5)')); ctx.strokeStyle = g; ctx.lineWidth = 3 * U; ctx.stroke(); ctx.restore(); return p;
}

/* ---------- elementos ---------- */
function ring(cx, cy, r, t, t0, col, lw = 6) { const p = eo(prog(t, t0, t0 + 1.1)); if (p <= 0) return; ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw * U; ctx.lineCap = 'round'; ctx.globalAlpha = .9; ctx.shadowColor = col; ctx.shadowBlur = 30 * U; ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2 + t * .6, -Math.PI / 2 + t * .6 + Math.PI * 2 * p); ctx.stroke(); ctx.restore(); }
function bar(x, y, w, h, t, t0, col) { const p = eo(prog(t, t0, t0 + .9)); if (p <= 0) return; const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, C.a); g.addColorStop(1, C.b); ctx.save(); ctx.fillStyle = col || g; ctx.shadowColor = C.a; ctx.shadowBlur = 24 * U; ctx.beginPath(); ctx.roundRect(x, y, w * p, h, h / 2); ctx.fill(); ctx.restore(); }
function pill(txt, cx, cy, sz, t, t0, o = {}) {
  const p = eob(prog(t, t0, t0 + .7)); if (p <= 0) return; const a = clamp(prog(t, t0, t0 + .3));
  const pw = wid(txt, sz, 700, sz * .12) + sz * 1.6, ph = sz * 2.1;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.scale(p, p);
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2 * U; ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = o.color || C.text; setFont(sz, 700, sz * .12); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, 2 * U); ctx.restore();
}
function lightSweep(t, t0, y, h) { const p = prog(t, t0, t0 + 1.2); if (p <= 0 || p >= 1) return; const x = lerp(-W * .3, W * 1.1, eio(p)); ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createLinearGradient(x - 200 * U, 0, x + 200 * U, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.transform(1, 0, -.35, 1, 0, 0); ctx.fillRect(x - 200 * U, y, 400 * U, h); ctx.restore(); }
function qrCard(cx, cy, size, t, t0) {
  const m = P.qr; if (!m) return; const p = eob(prog(t, t0, t0 + .9)); if (p <= 0) return;
  const n = m.length, quiet = 3, mod = size / (n + quiet * 2);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(p, p); ctx.globalAlpha = clamp(p * 2);
  ctx.shadowColor = C.a; ctx.shadowBlur = 60 * U; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-size / 2, -size / 2, size, size, 28 * U); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#0b0b0f';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) ctx.fillRect(-size / 2 + (x + quiet) * mod - .3, -size / 2 + (y + quiet) * mod - .3, mod + .6, mod + .6);
  ctx.restore();
  // moldura animada
  ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = C.b; ctx.lineWidth = 5 * U; ctx.shadowColor = C.b; ctx.shadowBlur = 24 * U; ctx.globalAlpha = .9 * eo(prog(t, t0 + .3, t0 + 1));
  const L = 70 * U, hs = size / 2 + 26 * U, k = 1 + .015 * Math.sin(t * 4);
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { ctx.beginPath(); ctx.moveTo(sx * hs * k, sy * (hs - L) * k); ctx.lineTo(sx * hs * k, sy * hs * k); ctx.lineTo(sx * (hs - L) * k, sy * hs * k); ctx.stroke(); }
  ctx.restore();
}
function exaSign(t, t0, cx, y) {
  const a = eo(prog(t, t0, t0 + .8)) * .9; if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.mute; setFont(22 * U, 600, 5 * U); ctx.textAlign = 'center'; ctx.fillText('EXIBIDO POR', cx, y);
  const lg = IM.exa; if (lg) { const w = 170 * U; ctx.drawImage(lg, cx - w / 2, y + 14 * U, w, w * lg.height / lg.width); } ctx.restore();
}

/* ---------- roteiro ---------- */
const NOME = (P.empresa || '').toUpperCase();
const MSG = (P.mensagem || '').toUpperCase();
const SUB = P.subtitulo || '';
const HAS_LOGO = !!(P.assets && P.assets.logo);
const T1 = 0, T2 = 2.8 * S, T3 = 5.8 * S, T4 = 7.9 * S;
function sceneAlpha(t, a, b, fi = .35, fo = .45) { return eio(prog(t, a, a + fi)) * (1 - eio(prog(t, b - fo, b))); }
function wipe(t, t0) { const p = prog(t, t0, t0 + .7); if (p <= 0 || p >= 1) return; const r = eio(p) * Math.hypot(W, H) * .75; ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(W / 2, H / 2, r * .86, W / 2, H / 2, r); g.addColorStop(0, C.a.replace(/[\d.]+\)$/, '0)')); g.addColorStop(.85, C.b.replace(/[\d.]+\)$/, (.55 * (1 - p)) + ')')); g.addColorStop(1, C.a.replace(/[\d.]+\)$/, '0)')); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.clearRect(0, 0, W, H);
  ctx.save(); const z = 1.02 + .06 * (t / DUR), pan = Math.sin(t * .4) * 12 * U; ctx.translate(W / 2 + pan, H / 2 + Math.cos(t * .33) * 8 * U); ctx.scale(z, z); ctx.rotate(Math.sin(t * .25) * .004); ctx.translate(-W / 2, -H / 2);
  bg(t);
  const cx = W / 2, cy = H / 2;

  // CENA 1 - marca (logo + nome + instagram)
  { const a = sceneAlpha(t, T1, T2 + .1, .01, .45); if (a > 0) { ctx.save(); ctx.globalAlpha = a;
      const ly = VERT ? H * .27 : H * .30;
      burst(cx, ly, t, .2);
      if (HAS_LOGO) logoCard(cx, ly, (VERT ? 520 : 460) * U, (VERT ? 300 : 240) * U, t, .35);
      else { ring(cx, ly, 150 * U, t, .1, C.b, 4); pill('APRESENTA', cx, ly, 22 * U, t, .25); }
      const sz = fitSize(NOME, W * .86, VERT ? 170 * U : 200 * U);
      kinetic(NOME, cx, VERT ? H * .50 : H * .56, sz, t, .8, { maxW: W * .86, accentWords: [0], blur: true });
      bar(cx - 160 * U, VERT ? H * .63 : H * .72, 320 * U, 9 * U, t, 1.6);
      igChip(cx, VERT ? H * .70 : H * .82, (VERT ? 40 : 34) * U, t, 1.7);
      ctx.restore(); } }
  wipe(t, T2 - .35);

  // CENA 2 - mensagem principal
  { const a = sceneAlpha(t, T2 + .1, T3 + .1); if (a > 0) { ctx.save(); ctx.globalAlpha = a;
      const sz = VERT ? 190 * U : 210 * U; const nw = MSG.split(' ').length;
      const gp = glass(cx, cy, W * .92, (VERT ? 1180 : 560) * U, t, T2 + .05);
      kinetic(MSG, cx, cy, sz, t, T2 + .25, { maxW: W * .84, stag: .16, accentWords: [nw - 1], lh: 1.02, blur: true });
      lightSweep(t, T2 + 1, cy - sz * 1.4, sz * 2.8);
      burst(cx, cy, t, T2 + .3, 40);
      ctx.restore(); } }
  wipe(t, T3 - .35);

  // CENA 3 - subtitulo / beneficio
  { const a = sceneAlpha(t, T3 + .1, T4 + .1); if (a > 0) { ctx.save(); ctx.globalAlpha = a;
      if (SUB) { const sz = VERT ? 96 * U : 100 * U; kinetic(SUB.toUpperCase(), cx, cy, sz, t, T3 + .15, { w: 800, maxW: W * .84, stag: .09, accentWords: [], color: C.text, blur: true }); }
      else kinetic(NOME, cx, cy, fitSize(NOME, W * .8, 150 * U), t, T3 + .15, { maxW: W * .86, accentWords: [0], blur: true });
      for (let k = 0; k < 3; k++) ring(cx, cy, (VERT ? 520 : 420) * U + k * 60 * U, t, T3 + .1 + k * .15, [C.a, C.b, C.c][k], 3);
      pill('EXIBIDO NO ELEVADOR DO SEU PREDIO', cx, VERT ? H * .80 : H * .86, 24 * U, t, T3 + .5);
      bar(cx - 220 * U, VERT ? H * .30 : H * .18, 440 * U, 9 * U, t, T3 + .2);
      ctx.restore(); } }
  wipe(t, T4 - .35);

  // CENA 4 - chamada final + QR + logo + instagram + assinatura EXA
  { const a = eio(prog(t, T4 + .1, T4 + .55)); if (a > 0) { ctx.save(); ctx.globalAlpha = a;
      const qs = VERT ? 520 * U : 450 * U; const hasQR = !!P.qr;
      burst(VERT ? cx : (hasQR ? W * .76 : cx), VERT ? H * .5 : H * .47, t, T4 + .2, 50);
      if (VERT) {
        kinetic(P.cta ? P.cta.toUpperCase() : 'CHAME AGORA', cx, H * .22, 150 * U, t, T4 + .1, { maxW: W * .86, accentWords: [1], blur: true });
        if (hasQR) qrCard(cx, H * .47, qs, t, T4 + .5);
        if (P.whats) pill(P.whats, cx, H * .68, 40 * U, t, T4 + 1.1, { color: C.text });
        igChip(cx, H * .75, 34 * U, t, T4 + 1.2);
        if (!logoCard(cx, H * .85, 300 * U, 110 * U, t, T4 + 1.0)) kinetic(NOME, cx, H * .85, fitSize(NOME, W * .8, 70 * U), t, T4 + .8, { w: 800, maxW: W * .86, color: C.mute });
        exaSign(t, T4 + 1.5, cx, H * .93);
      } else {
        const lx = hasQR ? W * .30 : W * .5;
        kinetic(P.cta ? P.cta.toUpperCase() : 'CHAME AGORA', lx, H * .36, 150 * U, t, T4 + .1, { maxW: W * (hasQR ? .52 : .8), accentWords: [1], blur: true });
        if (P.whats) pill(P.whats, lx, H * .58, 38 * U, t, T4 + .9);
        igChip(lx, H * .69, 30 * U, t, T4 + 1.0);
        if (!logoCard(lx, H * .82, 260 * U, 90 * U, t, T4 + .8)) kinetic(NOME, lx, H * .82, fitSize(NOME, W * .46, 62 * U), t, T4 + .7, { w: 800, maxW: W * .5, color: C.mute });
        if (hasQR) qrCard(W * .76, H * .47, qs, t, T4 + .4);
        exaSign(t, T4 + 1.3, hasQR ? W * .76 : W * .5, H * .88);
      }
      ctx.restore(); } }
  ctx.restore();

  // aberracao cromatica leve nas transicoes nao e viavel em 2D; usamos grao + flash + fade
  ctx.save(); ctx.globalAlpha = .045; for (let i = 0; i < 420; i++) { ctx.fillStyle = rnd(i + Math.floor(t * 24) * 7) > .5 ? '#fff' : '#000'; ctx.fillRect(rnd(i * 3 + Math.floor(t * 24)) * W, rnd(i * 5 + 2 + Math.floor(t * 24)) * H, 2, 2); } ctx.restore();
  const fi = 1 - eio(prog(t, 0, .35)), fo = eio(prog(t, DUR - .3, DUR)); const fa = Math.max(fi, fo); if (fa > 0) { ctx.fillStyle = `rgba(0,0,0,${fa})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- POS-PRODUCAO (estilo editor profissional): bloom, aberracao cromatica, light leaks, flare, shake, scanlines ---------- */
const SNAP = document.createElement('canvas'); SNAP.width = W; SNAP.height = H; const sx = SNAP.getContext('2d');
const TINT = document.createElement('canvas'); TINT.width = W; TINT.height = H; const tx = TINT.getContext('2d');
const IMPACTS = (VERT ? [2.8, 5.8, 7.9] : [2.8, 5.8, 7.9]).map(v => v * S);
function impact(t) { let m = 0; for (const k of IMPACTS) { const d = t - k; if (d > -.05 && d < .5) m = Math.max(m, Math.exp(-d * 7) * (d < 0 ? 1 + d * 20 : 1)); } return m; }
function post(t) {
  const imp = impact(t);
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.clearRect(0, 0, W, H); sx.drawImage(cv, 0, 0);
  // bloom: versao borrada somada por cima
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .10 + .14 * imp; ctx.filter = `blur(${20 * U}px)`; ctx.drawImage(SNAP, 0, 0); ctx.filter = 'none';
  ctx.globalAlpha = .07; ctx.filter = `blur(${60 * U}px)`; ctx.drawImage(SNAP, 0, 0); ctx.restore();
  // aberracao cromatica (canais deslocados, mais forte no impacto e nas bordas)
  const ab = (1.6 + 9 * imp) * U;
  for (const [col, dx] of [['#ff0000', -ab], ['#0000ff', ab]]) {
    tx.globalCompositeOperation = 'source-over'; tx.clearRect(0, 0, W, H); tx.drawImage(SNAP, 0, 0);
    tx.globalCompositeOperation = 'multiply'; tx.fillStyle = col; tx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .16 + .2 * imp; ctx.drawImage(TINT, dx, 0); ctx.restore();
  }
  // light leak varrendo
  const lk = ((t * .11) % 1); ctx.save(); ctx.globalCompositeOperation = 'screen'; const lg = ctx.createLinearGradient(W * (lk * 1.6 - .5), 0, W * (lk * 1.6 - .1), H);
  lg.addColorStop(0, 'rgba(255,120,60,0)'); lg.addColorStop(.5, C.b.replace(/[\d.]+\)$/, '0.06)')); lg.addColorStop(1, 'rgba(255,120,60,0)'); ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H); ctx.restore();
  // lens flare anamorfico no impacto
  if (imp > .02) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const fy = H * .5, g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, `rgba(255,255,255,${.55 * imp})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, fy - 3 * U, W, 6 * U);
    const rg = ctx.createRadialGradient(W / 2, fy, 0, W / 2, fy, 420 * U); rg.addColorStop(0, `rgba(255,255,255,${.35 * imp})`); rg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  // speed lines nas transicoes
  for (const k of IMPACTS) { const d = (t - k + .35) / .7; if (d > 0 && d < 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2 * U; for (let i = 0; i < 26; i++) { const y = rnd(i + 300) * H, L = (200 + rnd(i + 310) * 700) * U, x = ((d * 2.2 + rnd(i + 320)) % 1.4 - .2) * W; ctx.globalAlpha = Math.sin(d * Math.PI) * (.2 + rnd(i + 330) * .5); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - L, y); ctx.stroke(); } ctx.restore(); } }
  // scanlines sutis + letterbox cinema nas bordas
  ctx.save(); ctx.globalAlpha = .05; ctx.fillStyle = '#000'; for (let y = 0; y < H; y += 4 * U) ctx.fillRect(0, y, W, 1.4 * U); ctx.restore();
  const bl = ctx.createLinearGradient(0, 0, 0, H); bl.addColorStop(0, 'rgba(0,0,0,.35)'); bl.addColorStop(.12, 'rgba(0,0,0,0)'); bl.addColorStop(.88, 'rgba(0,0,0,0)'); bl.addColorStop(1, 'rgba(0,0,0,.35)'); ctx.fillStyle = bl; ctx.fillRect(0, 0, W, H);
}

const renderBase = render;
function render2(t) {
  const imp = impact(t); renderBase(t);
  if (imp > .02) { /* shake aplicado reaproveitando o quadro */ sx.setTransform(1, 0, 0, 1, 0, 0); sx.clearRect(0, 0, W, H); sx.drawImage(cv, 0, 0); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.drawImage(SNAP, (rnd(Math.floor(t * 60)) - .5) * 16 * U * imp, (rnd(Math.floor(t * 60) + 9) - .5) * 16 * U * imp); ctx.restore(); }
  post(t);
}
window.render = render2; window.DUR = DUR; window.W = W; window.H = H;
window.ready = () => Promise.all([document.fonts.load('900 100px Inter'), document.fonts.load('700 100px Inter'), loadAll()]);
</script></body></html>
