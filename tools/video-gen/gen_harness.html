<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script>
const P = window.P; const vert = P.formato === 'vertical_premium_15s';

window.W = W; window.H = H; window.DUR = DUR; window.ERRS = [];

  rnd: (s) => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); },
