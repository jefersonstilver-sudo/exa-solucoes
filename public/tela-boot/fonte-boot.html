<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#07030a;overflow:hidden;font-family:Inter,Arial,sans-serif}
#p{position:absolute;inset:0;background:#07030a;overflow:hidden}
.luz{position:absolute;border-radius:50%;opacity:0}
.a{width:120vmin;height:120vmin;left:-30vmin;bottom:-62vmin;background:radial-gradient(closest-side,rgba(234,37,29,.6),rgba(234,37,29,0))}
.b{width:120vmin;height:120vmin;right:-38vmin;top:-60vmin;background:radial-gradient(closest-side,rgba(156,30,110,.6),rgba(156,30,110,0))}
.meio{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
.logo{position:relative;display:inline-block;height:15vmin;opacity:0}
.logo img{height:100%;display:block}
.brilho{position:absolute;inset:0;overflow:hidden;-webkit-mask:url(exa-branco.svg) center/contain no-repeat}
.brilho i{position:absolute;top:-20%;bottom:-20%;width:35%;left:-60%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,215,160,.95),rgba(255,255,255,0))}
.trilho{position:relative;width:44vmin;height:.5vmin;margin:6vmin auto 0;border-radius:1vmin;background:rgba(255,255,255,.10);overflow:hidden;opacity:0}
.trilho i{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:1vmin;background:linear-gradient(90deg,#ea251d,#ff5a4a,#ffc35a);box-shadow:0 0 2vmin rgba(255,120,80,.7)}
.trilho b{position:absolute;top:0;bottom:0;width:28%;left:-30%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,240,220,.9),rgba(255,255,255,0))}
.frase{margin-top:3.6vmin;font-size:2vmin;font-weight:700;letter-spacing:1vmin;text-transform:uppercase;color:rgba(255,255,255,.8);opacity:0}
</style></head><body><div id="p">
<i class="luz a"></i><i class="luz b"></i>
<div class="meio"><span class="logo"><img src="exa-branco.svg"><span class="brilho"><i></i></span></span>
<div class="trilho"><i></i><b></b></div><div class="frase">examidia.com.br</div></div></div>
<script>
const e=[{easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'}][0];
const q=s=>document.querySelector(s);
window.anims=[
 q('.a').animate([{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'scale(1)'},{opacity:1,transform:'translate(5vmin,-3vmin) scale(1.1)'}],{duration:9000,easing:'ease-in-out',fill:'both',iterations:Infinity,direction:'alternate'}),
 q('.b').animate([{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'scale(1)'},{opacity:1,transform:'translate(-4vmin,4vmin) scale(1.06)'}],{duration:11000,delay:200,easing:'ease-in-out',fill:'both',iterations:Infinity,direction:'alternate'}),
 q('.logo').animate([{opacity:0,transform:'translateY(4vmin) scale(.94)',filter:'blur(1.2vmin)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:1400,delay:600,...e}),
 q('.brilho i').animate([{left:'-60%',offset:0},{left:'130%',offset:.55},{left:'130%',offset:1}],{duration:2800,delay:1800,iterations:Infinity,easing:'cubic-bezier(.5,0,.2,1)',fill:'backwards'}),
 q('.trilho b').animate([{left:'-30%'},{left:'100%'}],{duration:1600,delay:2600,iterations:Infinity,easing:'cubic-bezier(.45,0,.25,1)',fill:'backwards'}),
 q('.logo').animate([{transform:'scale(1)'},{transform:'scale(1.025)'},{transform:'scale(1)'}],{duration:3600,delay:2000,iterations:Infinity,easing:'ease-in-out',composite:'add'}),
 q('.trilho').animate([{opacity:0,transform:'scaleX(.3)'},{opacity:1,transform:'none'}],{duration:900,delay:1700,...e}),
 q('.trilho i').animate([{width:'0%'},{width:'55%'},{width:'80%'},{width:'92%'}],{duration:16000,delay:2000,easing:'cubic-bezier(.15,.7,.3,1)',fill:'both'}),
 q('.frase').animate([{opacity:0,transform:'translateY(1.5vmin)',letterSpacing:'1.6vmin'},{opacity:1,transform:'none',letterSpacing:'1.1vmin'}],{duration:1200,delay:2300,...e}),
];
anims.forEach(a=>a.pause());
window.ir=t=>anims.forEach(a=>{a.currentTime=t});
</script></body></html>
