<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="exa-build" content="__BUILD_ID__" />
    <meta name="theme-color" content="#000000" />
    <title>EXA · Tela</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* Só propriedades que navegador antigo de TV box entende (nada de inset, gap ou aspect-ratio aqui) */
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; user-select: none; -webkit-user-select: none; }
      #tela { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }

      /* ---------- intro EXA (abre a tela, depois de instalar e a cada atualização) ---------- */
      #intro { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; overflow: hidden; background: #07030a;
        font-family: Inter, Arial, Helvetica, sans-serif; color: #fff;
        -webkit-transition: opacity .8s ease, -webkit-transform .8s ease; transition: opacity .8s ease, transform .8s ease; }
      #intro.sai { opacity: 0; -webkit-transform: scale(1.06); transform: scale(1.06); }
      .in-luz { position: absolute; width: 120vmin; height: 120vmin; border-radius: 50%; opacity: 0; will-change: transform, opacity; }
      .in-luz.a { left: -30vmin; bottom: -62vmin; background: radial-gradient(closest-side, rgba(234,37,29,.55), rgba(234,37,29,0));
        -webkit-animation: in-acende 1.6s ease-out .1s forwards, in-flutua-a 9s ease-in-out 1.7s infinite alternate;
        animation: in-acende 1.6s ease-out .1s forwards, in-flutua-a 9s ease-in-out 1.7s infinite alternate; }
      .in-luz.b { right: -38vmin; top: -60vmin; background: radial-gradient(closest-side, rgba(156,30,110,.55), rgba(156,30,110,0));
        -webkit-animation: in-acende 1.6s ease-out .35s forwards, in-flutua-b 11s ease-in-out 2s infinite alternate;
        animation: in-acende 1.6s ease-out .35s forwards, in-flutua-b 11s ease-in-out 2s infinite alternate; }
      .in-centro { position: absolute; left: 0; right: 0; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); text-align: center; }
      .in-logo { position: relative; display: inline-block; height: 15vmin; opacity: 0; will-change: transform, opacity;
        -webkit-animation: in-logo 1.1s cubic-bezier(.2,.8,.2,1) .35s forwards; animation: in-logo 1.1s cubic-bezier(.2,.8,.2,1) .35s forwards; }
      .in-logo img { display: block; height: 100%; width: auto; }
      /* brilho que passa pela logo (recortado no formato da logo) */
      .in-brilho { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden;
        -webkit-mask: url(/site/exa-branco.svg) center / contain no-repeat; mask: url(/site/exa-branco.svg) center / contain no-repeat; }
      .in-brilho i { position: absolute; top: -20%; bottom: -20%; width: 35%; left: -60%;
        background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,215,160,.95), rgba(255,255,255,0));
        -webkit-animation: in-brilho 4.6s cubic-bezier(.5,0,.2,1) 1.25s infinite; animation: in-brilho 4.6s cubic-bezier(.5,0,.2,1) 1.25s infinite; }
      .in-linha { position: relative; width: 44vmin; height: .45vmin; margin: 5.2vmin auto 0; overflow: hidden; border-radius: 1vmin; background: rgba(255,255,255,.10); }
      .in-linha b { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: linear-gradient(90deg, #ea251d, #ff5a4a 60%, #ffc35a);
        -webkit-transform-origin: left center; transform-origin: left center; -webkit-transform: scaleX(0); transform: scaleX(0);
        -webkit-animation: in-traco 1s cubic-bezier(.7,0,.2,1) .15s forwards, in-some .6s ease 1.6s forwards;
        animation: in-traco 1s cubic-bezier(.7,0,.2,1) .15s forwards, in-some .6s ease 1.6s forwards; }
      .in-linha i { position: absolute; top: 0; bottom: 0; width: 30%; left: -30%; opacity: 0;
        background: linear-gradient(90deg, rgba(255,90,74,0), #ff5a4a, #ffc35a, rgba(255,195,90,0));
        -webkit-animation: in-aparece .4s ease 1.7s forwards, in-corre 1.5s cubic-bezier(.45,0,.25,1) 1.7s infinite;
        animation: in-aparece .4s ease 1.7s forwards, in-corre 1.5s cubic-bezier(.45,0,.25,1) 1.7s infinite; }
      .in-frase { margin-top: 3.4vmin; font-size: 1.9vmin; font-weight: 700; letter-spacing: 1.2em; text-transform: uppercase; color: rgba(255,255,255,.78); opacity: 0;
        -webkit-animation: in-frase 1.3s cubic-bezier(.2,.8,.2,1) 1.05s forwards; animation: in-frase 1.3s cubic-bezier(.2,.8,.2,1) 1.05s forwards; }
      .in-status { position: absolute; left: 0; right: 0; bottom: 7vmin; text-align: center; font-size: 1.7vmin; font-weight: 600; letter-spacing: .08em;
        color: rgba(255,255,255,.55); opacity: 0; -webkit-animation: in-aparece .8s ease 2.2s forwards; animation: in-aparece .8s ease 2.2s forwards; }
      .in-status.erro { color: #ffb4a8; font-size: 2vmin; line-height: 1.5; padding: 0 8vmin; letter-spacing: 0; }
      @-webkit-keyframes in-acende { to { opacity: 1; } } @keyframes in-acende { to { opacity: 1; } }
      @-webkit-keyframes in-aparece { to { opacity: 1; } } @keyframes in-aparece { to { opacity: 1; } }
      @-webkit-keyframes in-flutua-a { to { -webkit-transform: translate(14vmin, -8vmin) scale(1.12); } }
      @keyframes in-flutua-a { to { transform: translate(14vmin, -8vmin) scale(1.12); } }
      @-webkit-keyframes in-flutua-b { to { -webkit-transform: translate(-12vmin, 10vmin) scale(1.08); } }
      @keyframes in-flutua-b { to { transform: translate(-12vmin, 10vmin) scale(1.08); } }
      @-webkit-keyframes in-logo { from { opacity: 0; -webkit-transform: translateY(4vmin) scale(.88); } to { opacity: 1; -webkit-transform: none; } }
      @keyframes in-logo { from { opacity: 0; transform: translateY(4vmin) scale(.88); } to { opacity: 1; transform: none; } }
      @-webkit-keyframes in-brilho { 0% { left: -60%; } 38%, 100% { left: 130%; } }
      @keyframes in-brilho { 0% { left: -60%; } 38%, 100% { left: 130%; } }
      @-webkit-keyframes in-traco { to { -webkit-transform: scaleX(1); } } @keyframes in-traco { to { transform: scaleX(1); } }
      @-webkit-keyframes in-some { to { opacity: .18; } } @keyframes in-some { to { opacity: .18; } }
      @-webkit-keyframes in-corre { 0% { left: -30%; } 100% { left: 100%; } } @keyframes in-corre { 0% { left: -30%; } 100% { left: 100%; } }
      @-webkit-keyframes in-frase { from { opacity: 0; letter-spacing: 1.2em; } to { opacity: 1; letter-spacing: .55em; } }
      @keyframes in-frase { from { opacity: 0; letter-spacing: 1.2em; } to { opacity: 1; letter-spacing: .55em; } }
    </style>
  </head>
  <body>
    <div id="tela"></div>
    <div id="intro" aria-hidden="true">
      <div class="in-luz a"></div>
      <div class="in-luz b"></div>
      <div class="in-centro">
        <div class="in-logo"><img src="/site/exa-branco.svg" alt="EXA" /><span class="in-brilho"><i></i></span></div>
        <div class="in-linha"><b></b><i></i></div>
        <div class="in-frase">EXA Mídia · Foz do Iguaçu</div>
      </div>
      <div id="intro-status" class="in-status">Preparando a tela</div>
    </div>
    <script>
      // ES5 de propósito: roda em qualquer navegador de TV box, mesmo que o player não rode.
      (function () {
        var t0 = Date.now();
        var intro = document.getElementById('intro');
        var status = document.getElementById('intro-status');
        var ponte = window.ExaTela;
        var erros = [];
        // o app Android novo desenha a própria intro por cima da página (inclusive enquanto ela carrega)
        var introNativa = false;
        try { introNativa = !!(ponte && ponte.temIntro && ponte.temIntro()); } catch (e) {}
        if (introNativa && intro) { intro.parentNode.removeChild(intro); intro = null; }

        window.onerror = function (msg, src, linha) {
          var t = String(msg || 'erro') + (linha ? ' (linha ' + linha + ')' : '');
          erros.push(t);
          try { if (ponte && ponte.erroJs) ponte.erroJs(t); } catch (e) {}
        };

        var pronta = false;
        window.__telaPronta = function () {
          if (pronta) return;
          pronta = true;
          try { if (ponte && ponte.pronto) ponte.pronto(); } catch (e) {}
          if (!intro) return;
          // a intro toca inteira pelo menos uma vez (cerca de 2,8 s), depois some suavemente
          var falta = Math.max(0, 2800 - (Date.now() - t0));
          setTimeout(function () {
            intro.className = 'sai';
            setTimeout(function () { if (intro && intro.parentNode) intro.parentNode.removeChild(intro); intro = null; }, 900);
          }, falta);
        };

        // o player não abriu em 30 s: mostra o motivo na própria TV (versão do navegador e o erro)
        setTimeout(function () {
          if (window.__telaMontada || !status) return;
          var m = /Chrome\/(\d+)/.exec(navigator.userAgent);
          status.className = 'in-status erro';
          status.innerHTML = 'O player não abriu neste aparelho.<br>Navegador: ' + (m ? 'Chrome ' + m[1] : navigator.userAgent.slice(0, 80)) +
            (erros.length ? '<br>Erro: ' + erros[erros.length - 1].replace(/</g, '&lt;').slice(0, 160) : '') +
            '<br>Tente atualizar o “Android System WebView” ou fale com a EXA.';
        }, 30000);
      })();
    </script>
    <script type="module" src="/src/tela/main.tsx"></script>
  </body>
</html>
