name: Noticias das telas (Brasil e Foz)

# Gera e publica o Notícias Brasil (CNN) e o Notícias Foz (Portal da Cidade) sem depender do PC.
# Publica direto no sistema (tools/noticias/publish-video.mjs) com a chave de serviço.
# Disparo manual: Actions → "Noticias das telas" → Run workflow (publicar = nao só gera e guarda os vídeos).
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar nas telas?"
        type: choice
        options: [sim, nao]
        default: sim
      quais:
        description: "Quais gerar"
        type: choice
        options: [brasil e foz, brasil, foz]
        default: brasil e foz
      incluir:
        description: "Link de matéria da CNN para abrir o Notícias Brasil (opcional)"
        required: false
        default: ""

  # disparo pelo Claude: editar tools/noticias/disparo.txt (linhas publicar=, quais=, incluir=)
  push:
    branches: [main]
    paths: [tools/noticias/disparo.txt]

permissions:
  contents: write

concurrency:
  group: noticias-telas
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/noticias
    env:
      TZ: America/Sao_Paulo
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IN_PUBLICAR: ${{ github.event.inputs.publicar || 'sim' }}
      IN_QUAIS: ${{ github.event.inputs.quais || 'brasil e foz' }}
      IN_INCLUIR: ${{ github.event.inputs.incluir || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/noticias
      - name: Opções da rodada
        run: |
          P="$IN_PUBLICAR"; Q="$IN_QUAIS"; I="$IN_INCLUIR"
          if [ "${{ github.event_name }}" = "push" ]; then
            v(){ grep -E "^$1=" disparo.txt | head -1 | cut -d= -f2- | tr -d '\r'; }
            P="$(v publicar)"; Q="$(v quais)"; I="$(v incluir)"; [ -z "$Q" ] && Q="brasil e foz"
          fi
          echo "NOTICIAS_PUBLICAR=$([ "$P" = "nao" ] && echo 0 || echo 1)" >> $GITHUB_ENV
          echo "QUAIS=$Q" >> $GITHUB_ENV
          echo "INCLUIR=$I" >> $GITHUB_ENV
          echo "Publicar: $P · Quais: $Q"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Programas (ffmpeg e fontes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-dejavu-core >/dev/null
      - name: Dependências
        run: npm ci --no-audit --no-fund
      - name: Histórico do Foz (o que já passou nos últimos 7 dias)
        uses: actions/cache/restore@v4
        with:
          path: tools/noticias/output/_foz-*.json
          key: noticias-hist-${{ github.run_id }}
          restore-keys: noticias-hist-
      - name: Notícias Brasil
        id: brasil
        if: contains(env.QUAIS, 'brasil')
        continue-on-error: true
        run: |
          if [ -n "$INCLUIR" ]; then node cnn-news.mjs --incluir "$INCLUIR"; else node cnn-news.mjs; fi
      - name: Notícias Foz
        id: foz
        if: contains(env.QUAIS, 'foz')
        continue-on-error: true
        run: node foz-news.mjs
      - name: Resumo da Sofia ao CEO
        if: env.NOTICIAS_PUBLICAR == '1'
        continue-on-error: true
        run: node enviar-resumo.mjs
      - name: Guardar histórico do Foz
        if: env.NOTICIAS_PUBLICAR == '1'
        uses: actions/cache/save@v4
        with:
          path: tools/noticias/output/_foz-*.json
          key: noticias-hist-${{ github.run_id }}
      - name: Vídeos e registro desta rodada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-${{ github.run_id }}
          path: |
            tools/noticias/output/*.mp4
            tools/noticias/daily-dooh.log
          retention-days: 5
          if-no-files-found: ignore
      - name: Guardar resultado no ramo noticias-resultados (para conferência)
        if: always()
        run: |
          R=$(mktemp -d); mkdir -p $R/$GITHUB_RUN_ID
          cp daily-dooh.log $R/$GITHUB_RUN_ID/ 2>/dev/null || true
          if [ "$NOTICIAS_PUBLICAR" = "0" ]; then cp output/*.mp4 $R/$GITHUB_RUN_ID/ 2>/dev/null || true; fi
          cd $R && git init -q && git checkout -q -b noticias-resultados && git add -A && git -c user.email=bot@examidia.com.br -c user.name="EXA noticias" commit -qm "rodada $GITHUB_RUN_ID (publicar=$NOTICIAS_PUBLICAR)" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/noticias-resultados-$GITHUB_RUN_ID || true
      - name: Resultado
        if: always()
        run: |
          echo "Brasil: ${{ steps.brasil.outcome }} · Foz: ${{ steps.foz.outcome }}"
          if [ "${{ steps.brasil.outcome }}" = "failure" ] || [ "${{ steps.foz.outcome }}" = "failure" ]; then exit 1; fi
