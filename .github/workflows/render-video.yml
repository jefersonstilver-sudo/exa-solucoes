name: render-video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: sofia_video_jobs id
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with: { ffmpeg-version: release }
      - run: |
          # sem apt-get: o espelho do Ubuntu pode travar e estourar o tempo do job
          pip install playwright segno pillow anthropic pymupdf
          timeout 600 playwright install chromium || playwright install chromium --with-deps
      - run: python tools/video-gen/worker.py
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOFIA_WEBHOOK_TOKEN: ${{ secrets.SOFIA_WEBHOOK_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          LUCAS_MODEL: ${{ vars.LUCAS_MODEL }}
