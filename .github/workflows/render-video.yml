name: render-video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: sofia_video_jobs id
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # ffmpeg: o download da action as vezes falha ("fetch failed") e o video ficava parado na fila.
      # Tenta 2x pela action e, se ainda falhar, instala pelo apt (com tempo limite).
      - id: ff1
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true
        with: { ffmpeg-version: release }
      - id: ff2
        if: steps.ff1.outcome == 'failure'
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true
        with: { ffmpeg-version: release }
      - if: steps.ff1.outcome == 'failure' && steps.ff2.outcome == 'failure'
        run: |
          which ffmpeg && which ffprobe && exit 0
          sudo timeout 420 apt-get update -o Acquire::Retries=3 && sudo timeout 420 apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - run: |
          # sem apt-get: o espelho do Ubuntu pode travar e estourar o tempo do job
          pip install playwright segno pillow anthropic pymupdf
          timeout 600 playwright install chromium || playwright install chromium --with-deps
      - run: python tools/video-gen/worker.py
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOFIA_WEBHOOK_TOKEN: ${{ secrets.SOFIA_WEBHOOK_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          LUCAS_MODEL: ${{ vars.LUCAS_MODEL }}
