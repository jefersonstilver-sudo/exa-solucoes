name: subir-video-nando
# sobe o video de apresentacao do Nando (guardado no branch midia-nando, fora da main) para o Storage publico nando-midia/apresentacao/
on:
  workflow_dispatch:
    inputs:
      arquivo: { description: nome do arquivo no branch midia-nando, required: true, default: "nando_apresentacao.mp4" }
permissions:
  contents: read
jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          mkdir -p /tmp/v && git clone -q --depth 1 -b midia-nando "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" /tmp/m && cp "/tmp/m/${{ inputs.arquivo }}" /tmp/v/
          ls -la /tmp/v
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$URL/storage/v1/object/nando-midia/apresentacao/${{ inputs.arquivo }}" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: video/mp4" -H "x-upsert: true" -H "Cache-Control: 3600" \
            --data-binary @"/tmp/v/${{ inputs.arquivo }}")
          echo "::notice title=upload::HTTP $code $(head -c 200 /tmp/r.txt)"
          test "$code" = "200"
          curl -sI "$URL/storage/v1/object/public/nando-midia/apresentacao/${{ inputs.arquivo }}" | tr -d '\r' | grep -i -E "^HTTP|content-type|content-length" | tr '\n' ' ' | sed 's/^/::notice title=publico::/'
