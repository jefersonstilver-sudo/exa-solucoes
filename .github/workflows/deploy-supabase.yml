# EXA (06/11/2026) — deploy das edge functions direto do GitHub (sem Lovable).
# - push no main que muda supabase/functions/<nome>/ → publica só as funções que mudaram.
# - "Run workflow" (manual) → publica as funções listadas (separadas por espaço ou vírgula).
# Nunca publica por aqui: sofia-agent, asaas-*, clicksign-* (mantidas fora do repositório) e, no automático, nando-*
# (Nando só quando pedido: use o manual com o nome da função).
# Precisa do segredo SUPABASE_ACCESS_TOKEN no repositório (token pessoal do Supabase); sem ele o job só avisa e sai.
# Migrations NÃO rodam aqui: SQL continua pelo editor do Supabase.
name: Deploy Supabase (edge functions)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      funcoes:
        description: "Funções para publicar (ex.: exa2-relatorio-pedido exa-tela)"
        required: true

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: aakenoljsycyrcrchgxj
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quais funções
        id: lista
        env:
          MANUAL: ${{ github.event.inputs.funcoes }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL:-}" ]; then
            fns=$(echo "$MANUAL" | tr ',' ' ')
            auto=0
          else
            base="$ANTES"
            if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base="HEAD~1"; fi
            fns=$(git diff --name-only "$base" HEAD -- supabase/functions | awk -F/ 'NF>=4 {print $3}' | sort -u | tr '\n' ' ')
            if git diff --name-only "$base" HEAD -- supabase/functions/_shared | grep -q .; then
              echo "::warning::_shared mudou: as funções que importam esses arquivos precisam ser publicadas pelo manual."
            fi
            auto=1
          fi
          final=""
          for f in $fns; do
            case "$f" in
              _shared|"") continue ;;
              sofia-agent|asaas-*|clicksign-*) echo "::warning::$f é mantida fora do repositório: não publico por aqui."; continue ;;
              nando-*) if [ "$auto" = "1" ]; then echo "::notice::$f (Nando) só pelo manual."; continue; fi ;;
            esac
            if [ ! -d "supabase/functions/$f" ]; then echo "::warning::$f não existe no repositório."; continue; fi
            final="$final $f"
          done
          echo "funcoes=$(echo $final)" >> "$GITHUB_OUTPUT"
          echo "Funções: ${final:-nenhuma}"

      - name: Token presente?
        id: token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN no repositório: nada foi publicado."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == '1' && steps.lista.outputs.funcoes != ''
        with:
          version: latest

      - name: Publicar
        if: steps.token.outputs.ok == '1' && steps.lista.outputs.funcoes != ''
        run: |
          set -euo pipefail
          # o CLI novo recusa a seção [inbucket] (só serve para o Supabase local); troca só aqui no CI, sem mexer no repositório
          sed -i 's/^\[inbucket\]/[local_smtp]/' supabase/config.toml
          for f in ${{ steps.lista.outputs.funcoes }}; do
            echo "== $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api || supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api --debug
          done
