name: importar-ui-painel
# Traz o pacote da tela do painel (o mesmo que roda nos NUCs) para public/painel-web/ui, para a replica web.
on:
  workflow_dispatch:
    inputs:
      zip:
        description: endereco do pacote da tela
        required: false
        default: "https://sistema-update.s3.sa-east-1.amazonaws.com/ui_v33_nando.zip"
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: baixar e extrair
        run: |
          curl -fsSL --max-time 120 -o /tmp/ui.zip "${{ inputs.zip }}"
          rm -rf /tmp/ui && mkdir -p /tmp/ui && unzip -q /tmp/ui.zip -d /tmp/ui
          find /tmp/ui -maxdepth 3 | head -50
          rm -rf public/painel-web/ui && mkdir -p public/painel-web
          if [ -d /tmp/ui/ui ]; then cp -r /tmp/ui/ui public/painel-web/ui; else cp -r /tmp/ui public/painel-web/ui; fi
          ls -la public/painel-web/ui
      - name: salvar no repositorio
        run: |
          git config user.name "exa-bot"; git config user.email "bot@examidia.com.br"
          git add public/painel-web/ui
          git commit -m "Replica web: importa a tela do painel ($(basename '${{ inputs.zip }}'))" || echo "sem mudancas"
          git pull --rebase origin main && git push origin HEAD:main
