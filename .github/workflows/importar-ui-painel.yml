name: importar-ui-painel
# Traz o pacote da tela do painel (o mesmo que roda nos NUCs) para public/painel-web/, para a replica web.
on:
  workflow_dispatch:
    inputs:
      zip:
        description: endereco do pacote (zip) ou vazio
        required: false
        default: ""
      destino:
        description: pasta dentro de public/painel-web
        required: false
        default: "ui"
      listar:
        description: endereco de bucket para listar (salva em public/painel-web/_lista.xml)
        required: false
        default: ""
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: listar
        if: ${{ inputs.listar != '' }}
        run: |
          mkdir -p public/painel-web
          curl -sSL --max-time 60 "${{ inputs.listar }}" -o public/painel-web/_lista.xml || true
          head -c 3000 public/painel-web/_lista.xml
      - name: baixar e extrair
        if: ${{ inputs.zip != '' }}
        run: |
          curl -fsSL --max-time 120 -o /tmp/p.zip "${{ inputs.zip }}"
          rm -rf /tmp/p && mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          find /tmp/p -maxdepth 3 | head -80
          D="public/painel-web/${{ inputs.destino }}"
          rm -rf "$D" && mkdir -p "$(dirname "$D")"
          N="$(basename "$D")"
          if [ -d "/tmp/p/$N" ]; then cp -r "/tmp/p/$N" "$D"; else cp -r /tmp/p "$D"; fi
          ls -la "$D"
      - name: salvar no repositorio
        run: |
          git config user.name "exa-bot"; git config user.email "bot@examidia.com.br"
          git add public/painel-web
          git commit -m "Replica web: importa arquivos da tela do painel" || echo "sem mudancas"
          git pull --rebase origin main && git push origin HEAD:main
